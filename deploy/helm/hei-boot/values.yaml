replicaCount: 2

image:
  repository: hei-boot-admin
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: hei.example.com
  tlsSecretName: hei-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

env:
  SPRING_PROFILES_ACTIVE: prod
  SA_TOKEN_IS_READ_COOKIE: "true"
  SA_TOKEN_COOKIE_SECURE: "true"
  HEI_SECURITY_HSTS_MAX_AGE: "31536000"
  HEI_OBSERVABILITY_TRACING_ENABLED: "false"
  # External SnailJob Server — keep false until Server + token are ready
  SNAIL_JOB_ENABLED: "false"
  # SNAIL_JOB_SERVER_HOST: snail-job.example.com
  # SNAIL_JOB_SERVER_PORT: "17888"
  # SNAIL_JOB_NAMESPACE: 764d604ec6fc45f68cd92514c40e9e1a
  # SNAIL_JOB_GROUP: hei_boot_admin
  # SNAIL_JOB_TOKEN: change-me

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# External dependencies — point to managed Postgres/Redis.
secrets:
  create: false
  name: hei-boot-secrets
