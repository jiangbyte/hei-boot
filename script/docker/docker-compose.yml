# hei-boot 可选本地基础设施示意（postgres/redis）。
# 本地开发也可直接使用已有的 dev-postgres / dev-redis，不必用本文件 recreate。
# SnailJob Server：见 docker-compose.snailjob.yml + snailjob-flyway.sh。

services:
  postgres:
    image: postgres:16-alpine
    container_name: hei-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hei_boot
      POSTGRES_USER: hei
      POSTGRES_PASSWORD: hei
    volumes:
      - hei-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hei -d hei_boot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hei-redis
    ports:
      - "6379:6379"
    volumes:
      - hei-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hei-postgres-data:
  hei-redis-data:
