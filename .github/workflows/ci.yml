name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile & unit tests
        run: mvn -B -pl app/admin -am -Dsurefire.failIfNoSpecifiedTests=false test

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: hei_boot
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -p123456 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_WRITE_URL: jdbc:mysql://127.0.0.1:3306/hei_boot?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_WRITE_USERNAME: root
      DB_WRITE_PASSWORD: 123456
      DB_WRITE_DRIVER: com.mysql.cj.jdbc.Driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import MySQL schema
        run: mysql -h 127.0.0.1 -uroot -p123456 --protocol=TCP --default-character-set=utf8mb4 hei_boot < scripts/hei_boot.sql
      - name: Unit tests + dialect smoke
        run: mvn -B -pl app/admin -am -Dsurefire.failIfNoSpecifiedTests=false -Dhei.dialect.smoke=true test
