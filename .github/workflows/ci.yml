name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile & test
        run: mvn -B -pl app/admin -am -Dsurefire.failIfNoSpecifiedTests=false test

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  frontend-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
