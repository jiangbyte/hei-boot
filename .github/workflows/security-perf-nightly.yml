name: security-perf-nightly

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 CST
  workflow_dispatch:
    inputs:
      target:
        description: "ZAP / k6 target base URL"
        required: false
        default: "http://127.0.0.1:8080"

jobs:
  k6-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 smoke (health probe only without live stack)
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.target || 'http://127.0.0.1:8080' }}
        run: |
          # Nightly against a live endpoint when provided; otherwise document failure as infra-not-up.
          k6 run -e BASE_URL="$BASE_URL" -e VUS=2 -e DURATION=15s script/perf/k6-api-baseline.js

  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target || 'http://127.0.0.1:8080' }}
        run: |
          chmod +x script/security/zap-baseline.sh
          ./script/security/zap-baseline.sh "$TARGET"
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: script/security/out/
          if-no-files-found: ignore
