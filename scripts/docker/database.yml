# 基础设施：MySQL + Redis + MinIO（镜像名可通过 .env 覆盖，默认 Docker Hub）
# cp .env.example .env 后：docker compose -f scripts/docker/database.yml up -d
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.42}
    container_name: hei-mysql
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hei_boot}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - hei-mysql-data:/var/lib/mysql
      - ../db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - hei-net

  redis:
    image: ${REDIS_IMAGE:-redis:7.2.8}
    container_name: hei-redis
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/conf/redis.conf:/redis/config/redis.conf:ro
      - hei-redis-data:/redis/data
    command:
      - sh
      - -c
      - redis-server /redis/config/redis.conf --requirepass "$$REDIS_PASSWORD"
    restart: unless-stopped
    networks:
      - hei-net

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: hei-minio
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - hei-minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - hei-net

networks:
  hei-net:
    driver: bridge

volumes:
  hei-mysql-data:
  hei-redis-data:
  hei-minio-data:
