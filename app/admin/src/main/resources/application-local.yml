logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
    github.jiangbyte.io: ${LOGGING_LEVEL_HEI:debug}
    org.apache.ibatis: ${LOGGING_LEVEL_IBATIS:debug}
    com.baomidou.mybatisplus: ${LOGGING_LEVEL_MP:debug}
  structured:
    format:
      console: github.jiangbyte.io.common.log.format.HeiConsoleKeyValueStructuredLogFormatter
      file: github.jiangbyte.io.common.log.format.HeiKeyValueStructuredLogFormatter

spring:
  output:
    ansi:
      enabled: always
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USER:druid}
        login-password: ${DRUID_STAT_PASSWORD:druid}
      web-stat-filter:
        enabled: true
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 2
        min-idle: 2
        max-active: 20
        max-wait: 60000
        validation-query: select 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        filters: stat,wall,slf4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      datasource:
        master:
          type: ${spring.datasource.type}
          # 切换 MySQL：DB_WRITE_DRIVER=com.mysql.cj.jdbc.Driver 且 DB_WRITE_URL=jdbc:mysql://...（方言由 URL 自动识别）
          driver-class-name: ${DB_WRITE_DRIVER:org.postgresql.Driver}
          url: ${DB_WRITE_URL:jdbc:postgresql://127.0.0.1:5432/hei_boot}
          username: ${DB_WRITE_USERNAME:postgres}
          password: ${DB_WRITE_PASSWORD:123456}
          # --- MySQL 示例（启用时注释上方 PostgreSQL 四行，解开下方，并执行 scripts/db.mysql.sql）---
          # driver-class-name: com.mysql.cj.jdbc.Driver
          # url: ${DB_WRITE_URL:jdbc:mysql://127.0.0.1:3306/hei_boot?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
          # username: ${DB_WRITE_USERNAME:root}
          # password: ${DB_WRITE_PASSWORD:123456}
        slave:
          type: ${spring.datasource.type}
          driver-class-name: ${DB_READ_DRIVER:${DB_WRITE_DRIVER:org.postgresql.Driver}}
          url: ${DB_READ_URL:${DB_WRITE_URL:jdbc:postgresql://127.0.0.1:5432/hei_boot}}
          username: ${DB_READ_USERNAME:${DB_WRITE_USERNAME:postgres}}
          password: ${DB_READ_PASSWORD:${DB_WRITE_PASSWORD:123456}}
          # --- MySQL 示例 ---
          # driver-class-name: com.mysql.cj.jdbc.Driver
          # url: ${DB_READ_URL:${DB_WRITE_URL:jdbc:mysql://127.0.0.1:3306/hei_boot?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}}
          # username: ${DB_READ_USERNAME:${DB_WRITE_USERNAME:root}}
          # password: ${DB_READ_PASSWORD:${DB_WRITE_PASSWORD:123456}}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:123456}

hei:
  logging:
    json: false
  # 与种子 Fernet 密文 / hei-fastapi APP__CONFIG_CRYPTO_KEY 对齐（仅本地；生产用环境变量）
  config:
    crypto-key: ${HEI_CONFIG_CRYPTO_KEY:${APP__CONFIG_CRYPTO_KEY:XV1rJ-UPAbWeYjprihKNS3ZCCHdBuVbIc0WXmYc70ck=}}
  profile:
    identity:
      crypto-key: ${HEI_PROFILE_IDENTITY_CRYPTO_KEY:${hei.config.crypto-key:}}
  rate-limit:
    enabled: true
  log:
    audit:
      consume-enabled: true
