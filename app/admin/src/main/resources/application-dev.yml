logging:
  level:
    github.jiangbyte.io: ${LOGGING_LEVEL_HEI:info}
    # SQL 排查时可设 LOGGING_LEVEL_IBATIS=debug
    org.apache.ibatis: ${LOGGING_LEVEL_IBATIS:warn}
  structured:
    format:
      console: github.jiangbyte.io.common.log.format.HeiConsoleKeyValueStructuredLogFormatter
      file: github.jiangbyte.io.common.log.format.HeiKeyValueStructuredLogFormatter

spring:
  output:
    ansi:
      enabled: always
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USER:druid}
        login-password: ${DRUID_STAT_PASSWORD:druid}
      web-stat-filter:
        enabled: true
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 2
        min-idle: 2
        max-active: 20
        max-wait: 60000
        validation-query: select 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        filters: stat,wall,slf4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      datasource:
        master:
          type: ${spring.datasource.type}
          driver-class-name: org.postgresql.Driver
          url: ${DB_WRITE_URL:jdbc:postgresql://127.0.0.1:5432/hei_boot}
          username: ${DB_WRITE_USERNAME:postgres}
          password: ${DB_WRITE_PASSWORD:123456}
        slave:
          type: ${spring.datasource.type}
          driver-class-name: org.postgresql.Driver
          url: ${DB_READ_URL:${DB_WRITE_URL:jdbc:postgresql://127.0.0.1:5432/hei_boot}}
          username: ${DB_READ_USERNAME:${DB_WRITE_USERNAME:postgres}}
          password: ${DB_READ_PASSWORD:${DB_WRITE_PASSWORD:123456}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}
  flyway:
    enabled: true

# 仅本地用的 XXL-JOB Admin 位于 app/xxl-job（勿部署到生产）
hei:
  logging:
    json: false
  # 与 hei-fastapi/.env 的 APP__CONFIG_CRYPTO_KEY 保持一致（仅开发）
  config:
    crypto-key: ${HEI_CONFIG_CRYPTO_KEY:${APP__CONFIG_CRYPTO_KEY:XV1rJ-UPAbWeYjprihKNS3ZCCHdBuVbIc0WXmYc70ck=}}
  xxl-job:
    # 本地开发关闭（xxl-job-admin 未启动）；需要时在对应 yml 中开启
    enabled: false
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9004/xxl-job-admin}
    executor:
      appname: hei-boot-admin
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ./logs/xxl-job
      logretentiondays: 30
  log:
    audit:
      consume-enabled: ${HEI_LOG_AUDIT_CONSUME_ENABLED:${HEI_MQ_AUDIT_CONSUME_ENABLED:true}}
