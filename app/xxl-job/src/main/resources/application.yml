server:
  port: 9004
  servlet:
    context-path: /xxl-job-admin

spring:
  application:
    name: hei-xxl-job-admin
  threads:
    virtual:
      enabled: true
  web:
    resources:
      static-locations: classpath:/static/
    error:
      whitelabel:
        enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    servlet:
      load-on-startup: 0
    static-path-pattern: /static/**
  freemarker:
    templateLoaderPath: classpath:/templates/
    suffix: .ftl
    charset: UTF-8
    request-context-attribute: request
    settings:
      number_format: 0.##########
      new_builtin_class_resolver: safer
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: ${XXL_JOB_DB_URL:jdbc:postgresql://127.0.0.1:5432/hei_boot}
    username: ${XXL_JOB_DB_USERNAME:hei}
    password: ${XXL_JOB_DB_PASSWORD:hei}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USER:druid}
        login-password: ${DRUID_STAT_PASSWORD:druid}
      web-stat-filter:
        enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # XXL-JOB 告警发件人（XxlJobAdminBootstrap 必填）
    from: ${MAIL_FROM:${MAIL_USERNAME:xxl-job@localhost}}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

mybatis:
  mapper-locations: classpath:/mapper/**/*Mapper.xml

xxl:
  job:
    accessToken: default_token
    timeout: 3
    i18n: zh_CN
    triggerpool:
      fast:
        max: 300
      slow:
        max: 200
    schedule:
      batchsize: 100
    logretentiondays: 30

xxl-sso:
  token:
    key: xxl_job_login_token
    timeout: 604800000
  client:
    excluded:
      paths: ""
    login:
      path: /auth/login

management:
  server:
    base-path: /actuator
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

logging:
  level:
    root: info
    com.xxl.job: info
    com.alibaba.druid: warn
